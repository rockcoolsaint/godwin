name: Deploy QA

on:
  push:
    branches:
      - develop

jobs:
  Deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to AWS ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build, tag and push the Docker image to AWS ECR
        env:
          ECR_REGISTRY: 686795470659.dkr.ecr.us-east-2.amazonaws.com
          ECR_REPOSITORY: rigly-frontend-qa
          IMAGE_TAG: latest
        run: |
          echo $ECR_REGISTRY
          echo $ECR_REPOSITORY
          echo $IMAGE_TAG
          echo ""
          cd auction-ui
          docker build --build-arg PORT=${{ secrets.APP_PORT }} -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Pull and run the Docker image on AWS EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.QA_HOST }}
          username: ${{ secrets.QA_USERNAME }}
          password: ${{ secrets.QA_PASSWORD }}
          port: ${{ secrets.QA_PORT }}
          script: ./deploy_server.sh
