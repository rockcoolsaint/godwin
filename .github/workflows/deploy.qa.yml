name: Deploy QA

on:
  push:
    branches:
      - develop

jobs:
  Deploy:
    runs-on: ubuntu-latest
    environment: QA
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to AWS ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build, tag and push the Docker image to AWS ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.AWS_ECR_REPOSITORY_QA }}
          IMAGE_TAG: ${{ secrets.AWS_ECR_IMAGE_TAG_QA }}
          NODE_ENV: ${{ secrets.NODE_ENV }}
          NEXT_PUBLIC_APP_API_SERVER_URL: ${{ secrets.NEXT_PUBLIC_APP_API_SERVER_URL }}
          NEXT_PUBLIC_APP_CALLBACK_URL: ${{ secrets.NEXT_PUBLIC_APP_CALLBACK_URL }}
          NEXT_PUBLIC_APP_WS_SERVER_URL: ${{ secrets.NEXT_PUBLIC_APP_WS_SERVER_URL }}
          NEXT_PUBLIC_INTERCOM_ID: ${{ secrets.NEXT_PUBLIC_INTERCOM_ID }}
        run: |
          cd auction-ui
          docker build \
            --build-arg NODE_ENV=$NODE_ENV \
            --build-arg NEXT_PUBLIC_APP_API_SERVER_URL=$NEXT_PUBLIC_APP_API_SERVER_URL \
            --build-arg NEXT_PUBLIC_APP_WS_SERVER_URL=$NEXT_PUBLIC_APP_WS_SERVER_URL \
            --build-arg NEXT_PUBLIC_APP_CALLBACK_URL=$NEXT_PUBLIC_APP_CALLBACK_URL \
            --build-arg NEXT_PUBLIC_INTERCOM_ID=$NEXT_PUBLIC_INTERCOM_ID \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Pull and run the Docker image on AWS EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.QA_HOST }}
          username: ${{ secrets.QA_USERNAME }}
          password: ${{ secrets.QA_PASSWORD }}
          port: ${{ secrets.QA_PORT }}
          script: ./deploy_server.sh
