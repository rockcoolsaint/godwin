version: '3.9'

services:
  nextjs:
    ports:
      - '3000:3000'
    build:
      context: .
      dockerfile: Dockerfile.dev
    volumes:
      - .:/app
      - nextjs-dev-node_modules:/app/node_modules
      - nextjs-dev-next:/app/.next
    restart: always

volumes:
  nextjs-dev-node_modules:
  nextjs-dev-next:
